<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Profile Page</title>
    <link rel="stylesheet" href="instagramPage.css">
</head>
<body>
    <div class="container">
        <h1>Instagram Profile Page</h1>
        <div class="symbols">
            <div class="top-icons">
            <span class="add">➕</span>
            <span class="threeline">⋯</span>
            </div>
 </div>
 <div class="profile-section">
    <div class="profile-picture">
        <img src="https://wallpaperset.com/w/full/8/6/8/451840.jpg" alt="Profile Picture">
        <p>John Doe</p>
        <p>123 Posts</p>
        <p>1000 Followers</p>
        <p>500 Following</p>

    </div>
</div>

<div class="post-section">
    <div class="post">
        <img src="https://www.byrdie.com/thmb/uA3tGbX2my8IXGazLnQEbo25ntM=/2708x4062/filters:fill(auto,1)/GettyImages-911199570-c7347dab092841efac74925488146989.jpg" alt="Post 1">
        <p>Caption for Post 1</p>

        <img src="https://www.celebritycruises.com/content/dam/celebrity/new-images/CEL_RF_Aerial_RET_1-2560x1440.jpg" alt="Post 2">
        <p>Caption for Post 2</p>

        <img src="https://www.celebritycruises.com/content/dam/celebrity/new-images/CEL_RF_Aerial_RET_1-2560x1440.jpg" alt="Post 2">
        <p>Caption for Post 2</p>

        <img src="https://images.ctfassets.net/i3qftgsfkuei/7zN8FywtjmisgrHgatLqRS/74ea4f233da52ecbbb6a17acb08b376a/CEL_AT_Infinite_Veranda_2.jpg" alt="Post 2">
        <p>Caption for Post 2</p>
    </div>
</div>
<div class="task-bar">
    <span class="home">🏠</span>
    <span class="search">🔍</span>
    <span class="message">✉️</span>
    <span class="heart">❤️</span>
    <span class="profile">👤</span>
</div>
    </div>
</body>
</html>
